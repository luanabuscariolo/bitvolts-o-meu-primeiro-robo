<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="870" viewBox="0 0 1000 870"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#222362"/></marker></defs><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#222362" font-weight="700" text-anchor="start">Leitura da bateria: divisor antes do GPIO</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="400" text-anchor="start">O fio do GPIO sai da junção dos resistores, não de BAT+.</text><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 290" width="220.0" height="148.37209302325581" x="40.0" y="145.81395348837208"><rect x="10" y="10" width="400" height="230" rx="15" fill="#40845b"/><text x="220" y="85" font-family="Arial" font-size="34" text-anchor="middle" fill="white">PACOTE 2S</text><text x="220" y="140" font-family="Arial" font-size="29" text-anchor="middle" fill="white">7,4 V nominal</text><text x="220" y="200" font-family="Arial" font-size="26" text-anchor="middle" fill="white">Proteção a conferir</text><polyline points="0,70 10,70" stroke="#b92732" stroke-width="5" fill="none" stroke-linejoin="round"/><polyline points="0,175 10,175" stroke="#39434b" stroke-width="5" fill="none" stroke-linejoin="round"/><text x="24" y="80" font-family="Arial" font-size="28" fill="white">+</text><text x="24" y="185" font-family="Arial" font-size="28" fill="white">−</text></svg><text x="150" y="328" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="700" text-anchor="middle">Bateria 2S</text><text x="387" y="173" font-family="Arial, sans-serif" font-size="25" fill="#b92732" font-weight="700" text-anchor="start">BAT+</text><polyline points="430,191 430,230" fill="none" stroke="#b92732" stroke-width="5" stroke-linejoin="round"/><rect x="397" y="230" width="66" height="112" rx="3" fill="#f5e4bc" stroke="#222362" stroke-width="2"/><text x="490" y="287" font-family="Arial, sans-serif" font-size="25" fill="#222362" font-weight="700" text-anchor="start">R1 · 100 kΩ</text><polyline points="430,342 430,425 785,425" fill="none" stroke="#2569a4" stroke-width="5" stroke-linejoin="round"/><circle cx="430" cy="425" r="7" fill="#2569a4"/><rect x="785" y="365" width="175" height="160" rx="7" fill="#f2f3f8" stroke="#c3c7d7" stroke-width="2"/><text x="873" y="400" font-family="Arial, sans-serif" font-size="22" fill="#222362" font-weight="700" text-anchor="middle">ESP32-S3</text><text x="804" y="435" font-family="Arial, sans-serif" font-size="26" fill="#2569a4" font-weight="700" text-anchor="start">GPIO 1</text><polyline points="430,425 430,485" fill="none" stroke="#2569a4" stroke-width="5" stroke-linejoin="round"/><rect x="397" y="485" width="66" height="112" rx="3" fill="#f5e4bc" stroke="#222362" stroke-width="2"/><text x="270" y="550" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="700" text-anchor="middle">R2 · 47 kΩ</text><polyline points="430,597 430,675 725,675" fill="none" stroke="#39434b" stroke-width="5" stroke-linejoin="round"/><circle cx="655" cy="425" r="6" fill="#2569a4"/><polyline points="655,425 655,530" fill="none" stroke="#2569a4" stroke-width="5" stroke-linejoin="round"/><polyline points="620,530 690,530" fill="none" stroke="#222362" stroke-width="5" stroke-linejoin="round"/><polyline points="620,553 690,553" fill="none" stroke="#222362" stroke-width="5" stroke-linejoin="round"/><polyline points="655,553 655,675" fill="none" stroke="#39434b" stroke-width="5" stroke-linejoin="round"/><circle cx="655" cy="675" r="6" fill="#39434b"/><text x="725" y="555" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="700" text-anchor="start">100 nF</text><text x="485" y="716" font-family="Arial, sans-serif" font-size="25" fill="#39434b" font-weight="700" text-anchor="start">GND lógica</text><text x="40" y="783" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="400" text-anchor="start">8,4 V × 47 / (100 + 47) ≈ 2,69 V no GPIO 1.</text><text x="40" y="820" font-family="Arial, sans-serif" font-size="24" fill="#222362" font-weight="400" text-anchor="start">O capacitor liga a mesma junção ao GND e reduz ruído.</text><polyline points="40,181.62790697674416 25,181.62790697674416 25,125 430,125 430,191" stroke="#b92732" stroke-width="5" fill="none" stroke-linejoin="round"/><polyline points="40,235.3488372093023 25,235.3488372093023 25,675 430,675" stroke="#39434b" stroke-width="5" fill="none" stroke-linejoin="round"/><text x="804" y="509" font-family="Arial" font-size="24" fill="#39434b">GND (L)</text><polyline points="873,525 873,675 725,675" stroke="#39434b" stroke-width="5" fill="none" stroke-linejoin="round"/><circle cx="430" cy="675" r="6" fill="#39434b"/><text x="40" y="370" font-family="Arial" font-size="22" fill="#39434b">BAT− → GND comum</text></svg>