# Compila todos os programas do repositório a cada alteração,
# com as mesmas versões indicadas no livro.
name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.11
          libraries: |
            - name: ESP32Servo
              version: 3.2.1
            - name: U8g2
              version: 2.36.19
          sketch-paths: |
            - exemplos
            - firmware
          enable-warnings-report: true
